name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext libglib2.0-bin libglib2.0-dev-bin shellcheck python3-gi

      - name: Validate syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script" || exit 1
          done < <(find . -type f \( -name '*.sh' -o -name '*.bash' -o -path './bin/*' -o -path './tools/hooks/*' \) -print0)
          python3 -m py_compile $(find . -type f -name '*.py')

      - name: Run test suite
        run: |
          ./tools/check-all.sh -j 4

      - name: Validate pre-commit hook
        run: |
          ./tools/hooks/pre-commit
