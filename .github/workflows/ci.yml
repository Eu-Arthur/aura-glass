name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext libglib2.0-bin shellcheck python3-gi

      - name: Validate syntax
        run: |
          bash -n $(find . -type f \( -name '*.sh' -o -name '*.bash' -o -path './bin/*' -o -path './tools/hooks/*' \))
          python3 -m py_compile $(find . -type f -name '*.py')

      - name: Run test suite
        run: |
          ./tools/check-all.sh -j 4

      - name: Validate pre-commit hook
        run: |
          ./tools/hooks/pre-commit
